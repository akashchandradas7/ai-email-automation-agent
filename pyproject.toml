[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-email-automation-agent"
version = "1.0.0"
description = "Autonomous AI Email Automation Agent for outbound lead engagement, real-time inbound webhook triage, DNS MX validation, and CRM synchronization."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Akash Chandra Das", email = "akashcdasbd@gmail.com" }
]
keywords = [
    "ai-agent",
    "email-automation",
    "autonomous-agents",
    "deepseek",
    "brevo",
    "flask",
    "google-sheets",
    "rag"
]

dependencies = [
    "flask>=3.0.0",
    "gunicorn>=21.2.0",
    "requests>=2.31.0",
    "gspread>=6.0.0",
    "oauth2client>=4.1.3",
    "openai>=1.20.0",
    "dnspython>=2.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
